name: Feature request
description: Suggest an improvement to PlayNice.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you are trying to do. A description of the problem is more useful than a finished design.
  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: What can you not do today, or what is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What would you like PlayNice to do?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you get by today, if you do?
    validations:
      required: false
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: Who would this help, and how?
    validations:
      required: false
